<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 112 112">
  <!-- Favicon: MEF mark (images/logo_mef_mark.svg) simplified to stay readable at 16px:
       no sync arrows, thicker links, larger sources and hub -->
  <style>
    .hub { fill: #1a4162; }
    /* Dark browser UI: lighter hub, the MEF blue being too dark on a dark tab */
    @media (prefers-color-scheme: dark) { .hub { fill: #7cc4e4; } .core { fill: #1a4162; } }
  </style>
  <!-- Alignment links from each source to the hub -->
  <g stroke="#7cc4e4" stroke-width="10" stroke-linecap="round">
    <line x1="24" y1="24" x2="96" y2="96"/>
    <line x1="96" y1="24" x2="24" y2="96"/>
  </g>
  <!-- The four sources: VIAF, IdRef, GND, RERO -->
  <circle cx="22" cy="22" r="17" fill="#1ea1cf"/>
  <circle cx="98" cy="22" r="17" fill="#1765a2"/>
  <circle cx="98" cy="98" r="17" fill="#1ea1cf"/>
  <circle cx="22" cy="98" r="17" fill="#1765a2"/>
  <!-- Hub: the unified, stable MEF identifier -->
  <circle class="hub" cx="60" cy="60" r="27"/>
  <circle class="core" cx="60" cy="60" r="10" fill="#ffffff"/>
</svg>
