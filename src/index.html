<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MefUi</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- MEF favicon: SVG for the current browsers (adapted to dark mode), ICO for the older ones,
       PNG for the iOS home screen -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Applies the color theme before Angular starts, to avoid a flash of the light theme.
       Same storage key and class as ThemeService (src/app/theme.service.ts). -->
    <script>
      try {
        var mode = localStorage.getItem('mef-theme');
        if (mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('app-dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
