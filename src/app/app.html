<app-header [large]="isHome()" />

<main class="container mx-auto w-full flex-1 px-4 text-ink">
  <!-- Error page instead of the current one while the API is unavailable (`ApiStatus`) -->
  <!-- `!== null`: the status `0` (no response) is falsy -->
  @let unavailableStatus = apiStatus.unavailableStatus();
  @if (unavailableStatus !== null) {
    <app-error [status]="unavailableStatus">
      <button pButton type="button" (click)="apiStatus.retry()">
        <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
        Try again
      </button>
    </app-error>
  } @else {
    <router-outlet />
  }
</main>

<app-footer />
