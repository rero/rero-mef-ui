<!-- `static`: on mobile, the menu opens under the whole header instead of under the burger button -->
<p-menubar
  [model]="items"
  [dt]="tokens"
  ariaLabel="Main"
  class="static text-sm"
  [autoHide]="true"
  [autoHideDelay]="200"
  (mouseenter)="openOnHover()" />
