<!-- Expands to the left over the menu, without moving it -->
<div
  class="absolute top-0 right-0 z-10 flex items-center gap-1 rounded-full p-0.5 transition-colors duration-200"
  [class]="expanded() ? 'bg-[#13324d] shadow-lg ring-1 ring-white/25' : ''">
  <div
    id="theme-switch-options"
    class="flex items-center gap-1 overflow-hidden transition-all duration-200"
    [class]="expanded() ? 'max-w-20' : 'max-w-0 opacity-0'"
    [attr.inert]="expanded() ? null : ''">
    @for (option of others(); track option.value) {
      <button
        type="button"
        class="flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-full text-white hover:bg-white/15 focus-visible:bg-white/15"
        [title]="option.label"
        (click)="select(option.value, $event)">
        <i [class]="option.icon" aria-hidden="true"></i>
        <span class="sr-only">{{ option.label }}</span>
      </button>
    }
  </div>
  <button
    #currentButton
    type="button"
    class="flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-full bg-white/15 text-white ring-1 ring-white/30 hover:bg-white/25 focus-visible:bg-white/25"
    [title]="'Color theme: ' + current().label"
    [attr.aria-expanded]="expanded()"
    aria-controls="theme-switch-options"
    (click)="toggle()">
    <i [class]="current().icon" aria-hidden="true"></i>
    <span class="sr-only">Color theme: {{ current().label }}</span>
  </button>
</div>
